<section class="px-3 py-3.5 mx-auto max-w-7xl relative">
  <div class="grid grid-cols-12 items-start gap-5">
    <!----- زرار القائمة الجانبية اليسرى للموبايل ----->
    <button
      class="fixed xl:hidden bottom-52 inset-e-5 text-2xl p-2 rounded-3xl text-gray-200 bg-accent z-45"
    >
      <i
        [class.fa-bars]="!isNavOpen"
        [class.fa-xmark]="isNavOpen"
        (click)="toggleNav()"
        class="fa-solid"
      ></i>
    </button>

    <!----- زرار الأصدقاء المقترحين للموبايل ----->
    <button
      (click)="toggleSuggestedFriends()"
      class="fixed xl:hidden bottom-32 inset-e-5 text-2xl p-2 rounded-3xl bg-gray-200 text-accent z-45"
    >
      <i
        [class.fa-user-plus]="!isSuggestedFriendsOpen"
        [class.fa-xmark]="isSuggestedFriendsOpen"
        class="fa-solid"
      ></i>
    </button>

    <!----- القائمة الجانبية اليسرى (Left Sidebar) ----->
    <div
      #navBar
      [class.-translate-x-full]="!isNavOpen"
      class="col-span-12 xl:col-span-2 w-full transition-transform duration-300 xl:translate-x-0 bg-white dark:bg-dark form rounded-2xl p-3 fixed xl:sticky top-16 right-0 left-0 z-40 xl:z-0"
    >
      <app-side-left></app-side-left>
    </div>

    <!----- الأصدقاء المقترحين (موبايل - Drawer يفتح من اليمين) ----->
    <div
      [class.translate-x-full]="!isSuggestedFriendsOpen"
      [class.pointer-events-none]="!isSuggestedFriendsOpen"
      class="fixed xl:hidden top-0 right-0 h-full w-80 max-w-full bg-white dark:bg-dark form z-50 transition-transform duration-300 p-4 shadow-2xl overflow-y-auto [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-thumb]:rounded-full"
    >
      <!-- زر إغلاق سريع داخل القائمة للموبايل -->
      <div class="flex justify-end mb-3">
        <button (click)="toggleSuggestedFriends()" class="text-xl text-gray-500 hover:text-red-500">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <app-side-right></app-side-right>
    </div>

    <!----- المحتوى الرئيسي (Main Content / Feed) ----->
    <div class="col-span-12 xl:col-span-7 space-y-5">
      <app-feed-content></app-feed-content>
    </div>

    <!----- الأصدقاء المقترحين (ديسكتوب - ثابت في الـ Grid بقيمة 3) ----->
    <div
      class="hidden xl:block xl:col-span-3 w-full bg-white dark:bg-dark form sticky top-6 z-40 overflow-y-auto [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-thumb]:rounded-full"
    >
      <app-side-right></app-side-right>
    </div>
  </div>
</section>
