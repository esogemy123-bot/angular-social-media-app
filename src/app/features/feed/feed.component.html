<section class="px-3 py-3.5 mx-auto max-w-7xl relative">
  <div class="grid grid-cols-12 items-start gap-5">
    <!----- links side-bar (transition)  ----->
    <button class="fixed xl:hidden top-50 text-2xl p-2 rounded-3xl text-gray-200 bg-accent z-40">
      <i
        [class.fa-bars]="!isNavOpen"
        [class.fa-xmark]="isNavOpen"
        (click)="toggleNav()"
        class="fa-solid"
      ></i>
    </button>
    <div
      #navBar
      [class.-translate-x-full]="!isNavOpen"
      class="col-span-12 xl:col-span-2 w-full transition-transform duration-300 xl:translate-x-0 bg-white dark:bg-dark form rounded-2xl p-3 fixed top-16 right-0 left-0 xl:sticky z-40 xl:z-0"
    >
      <app-side-left></app-side-left>
    </div>
    <!----- main content (create post and posts) ----->
    <div class="col-span-12 xl:col-span-7 space-y-5">
      <app-feed-content></app-feed-content>
    </div>
    <!----- suggested friends ----->
    <div
      class="xl:col-span-3 xl:block w-full bg-white dark:bg-dark form sticky top-6 overflow-y-auto [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-thumb]:rounded-full"
    >
      <app-side-right></app-side-right>
    </div>
  </div>
</section>
