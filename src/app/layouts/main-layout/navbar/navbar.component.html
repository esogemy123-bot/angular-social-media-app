<nav
  class="bg-blue-50 px-3 md:py-3.5 p-2 shadow-gray-300 shadow-sm dark:shadow-none z-30 w-full dark:bg-linear-to-r dark:from-dark dark:to-dark-strong sticky top-0 left-0 right-0"
>
  <div class="container flex justify-between items-center mx-auto max-w-7xl px-2">
    <!----- logo sec ----->
    <div class="flex items-center justify-between gap-3">
      <img
        class="rounded-2xl w-10 h-10"
        src="images/route.png"
        [alt]="'NAVBAR.BRAND' | translate"
      />
      <h2
        class="font-extrabold sm:block hidden text-2xl bg-linear-to-l from-primary via-secondary to-accent bg-clip-text text-transparent"
      >
        {{ 'NAVBAR.BRAND' | translate }}
      </h2>
    </div>

    <!----- main links ----->
    <div
      class="bg-blue-100 dark:bg-dark dark:border-none font-bold text-xl text-gray-700 md:py-3 md:px-4 p-2 rounded-3xl flex justify-between items-center gap-8 border-gray-300 border-[0.8px]"
    >
      <div
        routerLink="feed"
        routerLinkActive="bg-linear-to-l from-primary to-accent bg-clip-text text-transparent dark:from-primary dark:to-accent !text-transparent"
        class="dark:text-gray-200 cursor-pointer flex justify-between items-center gap-2 hover:bg-linear-to-l hover:from-primary hover:to-accent hover:bg-clip-text hover:text-transparent transition-all duration-300"
        [attr.aria-label]="'NAVBAR.FEED' | translate"
      >
        <i class="fa-solid fa-house" aria-hidden="true"></i>
        <span class="xl:block hidden">{{ 'NAVBAR.FEED' | translate }}</span>
      </div>
      <div
        routerLink="profile"
        routerLinkActive="bg-linear-to-l from-primary to-accent bg-clip-text text-transparent dark:from-primary dark:to-accent !text-transparent"
        class="dark:text-gray-200 cursor-pointer flex justify-between items-center gap-2 hover:bg-linear-to-l hover:from-primary hover:to-accent hover:bg-clip-text hover:text-transparent transition-all duration-300"
        [attr.aria-label]="'NAVBAR.PROFILE' | translate"
      >
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span class="xl:block hidden">{{ 'NAVBAR.PROFILE' | translate }}</span>
      </div>
      <div
        routerLink="notification"
        routerLinkActive="bg-linear-to-l from-primary to-accent bg-clip-text text-transparent dark:from-primary dark:to-accent !text-transparent"
        class="dark:text-gray-200 cursor-pointer flex justify-between items-center gap-2 hover:bg-linear-to-l hover:from-primary hover:to-accent hover:bg-clip-text hover:text-transparent transition-all duration-300"
        [attr.aria-label]="'NAVBAR.NOTIFICATIONS' | translate"
      >
        <i class="fa-solid fa-comment" aria-hidden="true"></i>
        <span class="xl:block hidden">{{ 'NAVBAR.NOTIFICATIONS' | translate }}</span>
      </div>
    </div>

    <!----- list toggler ----->
    <div
      class="bg-blue-100 dark:bg-dark dark:border-none font-bold text-xl text-gray-700 md:py-2 md:px-3 px-3 py-1 rounded-full flex justify-between items-center gap-5 border-gray-300 border-[0.8px]"
    >
      @if (profile) {
        <img
          class="rounded-full w-10 h-10 object-cover"
          [src]="profile.photo"
          [alt]="profile.name || ('NAVBAR.BRAND' | translate)"
        />
        <h2
          class="font-bold bg-linear-to-l sm:block hidden from-primary via-secondary to-accent bg-clip-text text-transparent text-xl"
        >
          {{ profile.name }}
        </h2>
      } @else {
        <div class="rounded-full w-10 h-10 bg-gray-300 animate-pulse" aria-hidden="true"></div>
        <div
          class="h-4 w-16 bg-gray-300 animate-pulse sm:block hidden rounded"
          aria-hidden="true"
        ></div>
      }
      <button
        type="button"
        [class.hidden]="isMenuOpen"
        (click)="toggleMenu()"
        #menuToggler
        class="cursor-pointer hover:-translate-y-0.5 transition-all duration-300 bg-linear-to-l from-primary via-secondary to-accent bg-clip-text text-transparent"
      >
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        [class.hidden]="!isMenuOpen"
        (click)="closeMenu()"
        #menuClose
        class="cursor-pointer hover:-translate-y-0.5 transition-all duration-300 bg-linear-to-l from-primary via-secondary to-accent bg-clip-text text-transparent"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</nav>
<menu
  #menu
  [class.translate-x-full]="!isMenuOpen && currentLang !== 'ar'"
  [class.-translate-x-full]="!isMenuOpen && currentLang === 'ar'"
  [class.translate-x-0]="isMenuOpen"
  id="main-menu"
  class="h-screen z-50 transition-transform duration-300 dark:bg-dark space-y-2 bg-blue-100 fixed inset-e-0 top-0 xl:w-1/5 md:w-1/3 sm:w-1/3 w-[60%] shadow-md shadow-gray-300 p-4"
>
  <h4
    class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider flex items-center gap-2"
  >
    {{ 'NAVBAR.CUSTOMIZE_FONT' | translate }}
  </h4>
  <div class="space-y-2" role="radiogroup" aria-label="اختيار نوع الخط">
    <!-- 1. Alexandria -->
    <button
      (click)="setAppFont('font-alexandria')"
      [class.active]="fontService.getCurrentFont() === 'font-alexandria'"
      class="font-option cursor-pointer w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all text-start group flex justify-between items-center group-[.active]:border-primary group-[.active]:bg-blue-50/50 dark:group-[.active]:bg-slate-800"
      role="radio"
      type="button"
    >
      <div>
        <span
          class="font-alexandria block text-lg font-bold text-slate-800 dark:text-slate-200 group-[.active]:text-primary group-hover:text-primary transition-colors mb-0.5"
        >
          Alexandria
        </span>
        <span class="text-xs text-slate-400 block">Alexandria</span>
      </div>
      <div
        class="opacity-0 group-[.active]:opacity-100 text-primary transition-opacity pl-2"
        aria-hidden="true"
      >
        <i class="fa-solid fa-circle-check text-xl"></i>
      </div>
    </button>

    <!-- 2. Tajawal -->
    <button
      (click)="setAppFont('font-tajawal')"
      [class.active]="fontService.getCurrentFont() === 'font-tajawal'"
      class="font-option cursor-pointer w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all text-start group flex justify-between items-center group-[.active]:border-primary group-[.active]:bg-blue-50/50 dark:group-[.active]:bg-slate-800"
      role="radio"
      type="button"
    >
      <div>
        <span
          class="font-tajawal block text-lg font-bold text-slate-800 dark:text-slate-200 group-[.active]:text-primary group-hover:text-primary transition-colors mb-0.5"
        >
          Tajawal
        </span>
        <span class="text-xs text-slate-400 block">{{ 'NAVBAR.DEFAULT_FONT' | translate }}</span>
      </div>
      <div
        class="opacity-0 group-[.active]:opacity-100 text-primary transition-opacity pl-2"
        aria-hidden="true"
      >
        <i class="fa-solid fa-circle-check text-xl"></i>
      </div>
    </button>

    <!-- 3. Cairo -->
    <button
      (click)="setAppFont('font-cairo')"
      [class.active]="fontService.getCurrentFont() === 'font-cairo'"
      class="font-option cursor-pointer w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all text-start group flex justify-between items-center group-[.active]:border-primary group-[.active]:bg-blue-50/50 dark:group-[.active]:bg-slate-800"
      role="radio"
      type="button"
    >
      <div>
        <span
          class="font-cairo block text-lg font-bold text-slate-800 dark:text-slate-200 group-[.active]:text-primary group-hover:text-primary transition-colors mb-0.5"
        >
          Cairo
        </span>
        <span class="text-xs text-slate-400 block">Cairo</span>
      </div>
      <div
        class="opacity-0 group-[.active]:opacity-100 text-primary transition-opacity pl-2"
        aria-hidden="true"
      >
        <i class="fa-solid fa-circle-check text-xl"></i>
      </div>
    </button>
  </div>

  <h4
    class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider flex items-center gap-2"
  >
    {{ 'NAVBAR.CUSTOMIZE_THEME' | translate }}
  </h4>
  <div class="grid grid-cols-3 p-4 py-2 gap-2">
    <button
      type="button"
      (click)="setColorProperty('purpleBlue')"
      [class.border-purple-600]="selectedColor === 'purpleBlue'"
      class="rounded-full bg-purple-400 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="purpleBlue"
    ></button>
    <button
      type="button"
      (click)="setColorProperty('pinkOrange')"
      [class.border-orange-600]="selectedColor === 'pinkOrange'"
      class="rounded-full bg-orange-400 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="pinkOrange"
    ></button>
    <button
      type="button"
      (click)="setColorProperty('greenEmerald')"
      [class.border-green-600]="selectedColor === 'greenEmerald'"
      class="rounded-full bg-green-400 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="greenEmerald"
    ></button>
    <button
      type="button"
      (click)="setColorProperty('blueCian')"
      [class.border-blue-600]="selectedColor === 'blueCian'"
      class="rounded-full bg-blue-400 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="blueCian"
    ></button>
    <button
      type="button"
      (click)="setColorProperty('redRose')"
      [class.border-red-700]="selectedColor === 'redRose'"
      class="rounded-full bg-red-600 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="redRose"
    ></button>
    <button
      type="button"
      (click)="setColorProperty('amberOrange')"
      [class.border-yellow-600]="selectedColor === 'amberOrange'"
      class="rounded-full bg-yellow-500 w-14 h-14 cursor-pointer hover:scale-105 transition-all duration-200 border-white border-3"
      data-color="amberOrange"
    ></button>
  </div>

  <button
    type="button"
    routerLink="profile"
    (click)="closeMenu()"
    routerLinkActive="bg-clip-text bg-linear-to-r from-primary to-secondary text-transparent"
    class="p-3 hover:text-accent cursor-pointer transition-all duration-200 py-2 text-start w-full text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider"
  >
    <i class="fa-solid fa-user" aria-hidden="true"></i>
    {{ 'NAVBAR.PROFILE' | translate }}
  </button>
  <br />
  <button
    (click)="closeMenu()"
    type="button"
    routerLink="change"
    routerLinkActive="bg-clip-text bg-linear-to-r from-primary to-secondary text-transparent"
    class="p-3 hover:text-accent cursor-pointer transition-all duration-200 py-1 text-start w-full text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider"
  >
    <i class="fa-solid fa-gear" aria-hidden="true"></i>
    {{ 'NAVBAR.SETTINGS' | translate }}
  </button>
  <app-select-lang></app-select-lang>

  <button
    type="button"
    (click)="playDarkMood()"
    class="p-3 hover:text-slate-800 dark:hidden block cursor-pointer transition-all duration-200 py-1 text-start w-full text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider"
  >
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
    {{ 'NAVBAR.DARK_MODE' | translate }}
  </button>
  <button
    type="button"
    (click)="stopDarkMood()"
    class="px-3 hover:text-yellow-500 text-yellow-400 hidden dark:block cursor-pointer transition-all duration-200 text-start w-full uppercase font-bold tracking-wider"
  >
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
    {{ 'NAVBAR.LIGHT_MODE' | translate }}
  </button>
  <button
    type="button"
    (click)="logOut()"
    routerLinkActive="text-red-700"
    class="px-3 py-1 text-[16px] text-center text-red-400 hover:text-red-700 cursor-pointer transition-all duration-200 font-bold w-full space-x-5"
  >
    {{ 'NAVBAR.LOG_OUT' | translate }}
  </button>
</menu>
<div
  aria-hidden="true"
  [class.hidden]="!isMenuOpen"
  (click)="closeMenu()"
  class="fixed inset-0 bg-black/50 backdrop-blur-[2px] z-40"
  #layer
></div>
